services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: compfest          # ← bukan booking_events
      POSTGRES_USER: compfest_dev    # ← bukan dev
      POSTGRES_PASSWORD: compfest_dev # ← bukan dev
    ports:
      - "5455:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compfest_dev -d compfest"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: compfest_test     # ← bukan booking_events_test
      POSTGRES_USER: compfest_dev    # ← bukan dev
      POSTGRES_PASSWORD: compfest_dev # ← bukan dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compfest_dev -d compfest_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5