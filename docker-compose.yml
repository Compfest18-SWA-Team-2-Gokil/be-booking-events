services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: compfest          # ← bukan booking_events
      POSTGRES_USER: compfest_dev    # ← bukan dev
      POSTGRES_PASSWORD: compfest_dev # ← bukan dev
    ports:
      - "5455:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compfest_dev -d compfest"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: compfest_test    
      POSTGRES_USER: compfest_dev    
      POSTGRES_PASSWORD: compfest_dev 
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compfest_dev -d compfest_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9002:9000"   # S3 API  (9000 mungkin dipakai project lain)
      - "9003:9001"   # Web console → http://localhost:9003
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
