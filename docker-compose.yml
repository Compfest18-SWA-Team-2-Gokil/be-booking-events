services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking_events
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d booking_events"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking_events_test
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d booking_events_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
