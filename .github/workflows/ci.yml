name: CI

on:
  push:
    branches: [ main, master, "feat/**", "chores/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: compfest_test
          POSTGRES_USER: compfest_dev
          POSTGRES_PASSWORD: compfest_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://compfest_dev:compfest_dev@localhost:5433/compfest_test?sslmode=disable
        run: go run ./cmd/migrate up

      - name: Run Unit & Integration Tests
        env:
          TEST_DATABASE_URL: postgres://compfest_dev:compfest_dev@localhost:5433/compfest_test?sslmode=disable
          JWT_SECRET_KEY: ci-jwt-secret-key-for-testing
          QR_SECRET_KEY: ci-qr-secret-key-for-testing
          QUEUE_SECRET_KEY: ci-queue-secret-key-for-testing
          REDIS_URL: redis://localhost:6379
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check Code Formatting & Vetting
        run: |
          go vet ./...
